name: CI

# Third-party actions are pinned to a commit, not a tag: a tag can be moved to
# point at different code, and these run with access to the repository. The
# trailing comment is the release each SHA corresponds to.

on:
  # Only the default branch on push: branches with a pull request are covered
  # by the pull_request event, and running both would double every run.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly, so the long Linux boot regression still runs regularly.
    - cron: '0 3 * * 1'

# A new push supersedes the run in flight for the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The toolchain is pinned and large (oss-cad-suite, xPack GCC, a Spike build),
# so it is installed under $HOME and cached. scripts/setup_toolchain.sh skips
# anything already present, which makes a cache hit close to free.
env:
  PREFIX: /home/runner/toolchain
  BINDIR: /home/runner/.local/bin
  SRCDIR: /home/runner/src

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # dtc is what Spike's configure looks for; taking the distribution
      # package keeps the setup script from having to build it.
      - name: Install host packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends device-tree-compiler

      - name: Cache toolchain
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            /home/runner/toolchain
            /home/runner/src/spike
          key: toolchain-${{ runner.os }}-${{ hashFiles('scripts/setup_toolchain.sh') }}

      - name: Cache riscv-tests
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: third_party/riscv-tests
          key: riscv-tests-${{ hashFiles('scripts/setup_toolchain.sh') }}

      - name: Install toolchain
        run: |
          mkdir -p "$BINDIR"
          WITH_TESTS=1 scripts/setup_toolchain.sh
          echo "$BINDIR" >> "$GITHUB_PATH"

      # Downloaded archives are only needed to install; dropping them keeps the
      # cache entry to the installed trees.
      - name: Trim download cache
        run: rm -rf "$PREFIX/dl"

      - name: Lint
        run: make lint

      - name: Unit tests
        run: |
          make veryl-test
          make plic-multi-test

      - name: Build the simulator
        run: make tb

      - name: riscv-tests
        run: |
          make isa-build
          make run-isa

      - name: Directed tests
        run: make cov-test

      - name: Coverage
        run: make cov-check

      - name: Spike cosimulation
        run: make cosim

      # Board-independent check of the FPGA platform: the RTL UART, RAM and
      # boot stub, exercised by the demo firmware over a decoded serial line.
      - name: FPGA platform
        run: make fpga-sim por-test lcd-test lcd-mmio-test lcd-soc-test

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: logs
          path: logs/
          retention-days: 14

  # Synthesis for the Arty A7 port, to catch a board top or constraint file that
  # no longer elaborates. Place-and-route is not run: it needs openXC7, which is
  # not part of the pinned toolchain. make fpga-sim covers the RTL on every push.
  fpga-synth:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install host packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends device-tree-compiler

      - name: Cache toolchain
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            /home/runner/toolchain
            /home/runner/src/spike
          key: toolchain-${{ runner.os }}-${{ hashFiles('scripts/setup_toolchain.sh') }}

      - name: Install toolchain
        run: |
          mkdir -p "$BINDIR"
          scripts/setup_toolchain.sh
          echo "$BINDIR" >> "$GITHUB_PATH"
          echo "$PREFIX/oss-cad-suite/bin" >> "$GITHUB_PATH"

      # The script is called directly rather than through make: it exits 3 to
      # mean "synthesis finished, no Xilinx place-and-route available", and make
      # would report its own 2 instead.
      - name: Arty A7 synthesis
        run: |
          scripts/build_fpga.sh arty || [ $? -eq 3 ]

      - name: Upload synthesis logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fpga-synth
          path: sim/fpga/arty/*.log
          retention-days: 14

  # The kernel build plus an ~8e8 cycle boot is far longer than the checks
  # above, so it runs on a schedule and on demand rather than per push.
  linux-boot:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 240

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install host packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends device-tree-compiler flex bison bc

      - name: Cache toolchain
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            /home/runner/toolchain
            /home/runner/src/spike
          key: toolchain-${{ runner.os }}-${{ hashFiles('scripts/setup_toolchain.sh') }}

      - name: Install toolchain and kernel sources
        run: |
          mkdir -p "$BINDIR"
          WITH_LINUX=1 scripts/setup_toolchain.sh
          echo "$BINDIR" >> "$GITHUB_PATH"

      - name: Build Linux
        run: LINUX_SRC="$SRCDIR/linux" make linux-build

      - name: Boot Linux
        run: make linux-boot

      - name: Upload console log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux-console
          path: logs/linux/
          retention-days: 14
